name: CI

# Tests + build on every push to main and every PR. Publishing to GitHub
# Pages lives in pages.yml, which runs after this finishes (workflow_run) and
# takes the built site from the `site` artifact below - so branch code only
# ever runs here, in an unprivileged run, never in the one that can deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'generators/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'generators/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes a PR's running CI; main runs all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR code runs below (tests, build); don't leave the token on disk.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run build
      - run: pnpm run check:size
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Static files only; pages.yml publishes main's at the root and a
      # labelled PR's under /preview/<branch>/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          retention-days: 30
