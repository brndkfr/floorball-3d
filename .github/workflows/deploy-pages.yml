name: CI

# Tests + build on every push to main and every PR. Publishing to GitHub
# Pages lives in pages.yml, which runs after this finishes (workflow_run) and
# takes the built site from the `site` artifact below - so branch code only
# ever runs here, in an unprivileged run, never in the one that can deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'generators/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'generators/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes a PR's running CI; main runs all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run build
      - run: pnpm run check:size
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Static files only; pages.yml publishes main's at the root and a
      # labelled PR's under /preview/<branch>/.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 30
